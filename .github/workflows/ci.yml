name: CI

on:
  push:
    branches: [ "master" ]
    tags:
      - '**'
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          pip install uv
          uv sync --all-extras
      - name: Format
        run: ruff format youtube_transcript_api --check
      - name: Lint
        run: ruff check youtube_transcript_api

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install uv
          uv sync --all-extras
      - name: Run tests
        run: |
          coverage run -m pytest youtube_transcript_api && coverage xml
      - name: Report intermediate coverage report
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.xml
          format: cobertura
          flag-name: run-python-${{ matrix.python-version }}
          parallel: true

  coverage:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Finalize coverage report
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          carryforward: "run-python-3.8,run-python-3.9,run-python-3.10,run-python-3.11,run-python-3.12,run-python-3.13"
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          pip install uv
          uv sync --all-extras
      - name: Check coverage
        run: coverage report -m --fail-under=100

  publish:
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    needs: [coverage, static-checks]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          pip install uv
          uv sync
      - name: Build
        run: uv build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
